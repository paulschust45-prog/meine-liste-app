name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK ist auf den GitHub-Runnern vorinstalliert
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund

      - name: Capacitor synchronisieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk meine-liste.apk

      - uses: actions/upload-artifact@v4
        with:
          name: meine-liste-apk
          path: meine-liste.apk

      # Feste Download-Adresse fürs Handy: …/releases/download/latest/meine-liste.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Meine Liste (neueste Version)
          body: APK zum Installieren auf Android. Wird bei jeder Änderung automatisch neu gebaut.
          files: meine-liste.apk
          make_latest: true
